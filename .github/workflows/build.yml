```yaml
name: Build Ardillita

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No se encontró el ZIP"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Encontrar proyecto
        run: |
          PROJECT=$(find extracted -name "build.gradle" -type f -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "No se encontró build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Proyecto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ardillita-Forge-1.20.1
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
```
