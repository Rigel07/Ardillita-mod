name: Build Ardillita

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o "$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)" -d extracted

      - name: Find project
        run: |
          PROJECT=$(find extracted -name build.gradle -type f | head -n 1)
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ardillita
          path: extracted/**/build/libs/*.jar
