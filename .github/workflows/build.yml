```yaml
name: Build Ardillita

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Ardillita
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se ha encontrado ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "Proyecto extraído:"
          find extracted -maxdepth 3 -type f | sort

      - name: Localizar proyecto Gradle
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -name "build.gradle" -type f -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se ha encontrado build.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Proyecto encontrado en: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Comprobar versiones
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Compilar Ardillita
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Compilando desde:"
          pwd

          echo "Archivos:"
          ls -la

          gradle build --no-daemon

      - name: Guardar MOD JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ardillita-Forge-1.20.1
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
```
