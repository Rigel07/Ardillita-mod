name: Build Ardillita

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar lo que hay en el repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Instalar Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Buscar y extraer el ZIP del mod
      - name: Extraer proyecto Ardillita
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se ha encontrado ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "Contenido extraído:"
          find extracted -maxdepth 3 -type f | sort

      # 4. Localizar automáticamente la carpeta que contiene build.gradle
      - name: Localizar proyecto Gradle
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -name "build.gradle" -type f -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se ha encontrado build.gradle dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Proyecto encontrado en: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Preparar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Compilar el mod
      - name: Compilar Ardillita
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Compilando desde:"
          pwd

          echo "Archivos del proyecto:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            echo "No se encontró gradlew."
            echo "Usando Gradle instalado."
            gradle build --no-daemon
          fi

      # 7. Subir el JAR terminado
      - name: Guardar MOD JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ardillita-Forge-1.20.1
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
